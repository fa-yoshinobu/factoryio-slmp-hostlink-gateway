name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release. Leave empty to use GatewayApp.csproj.
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    outputs:
      release_tag: ${{ steps.publish_release.outputs.release_tag }}
    name: Build and publish release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: factoryio-slmp-hostlink-gateway
    steps:
      - name: Checkout gateway
        uses: actions/checkout@v4
        with:
          path: factoryio-slmp-hostlink-gateway

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Resolve release version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          [xml]$project = Get-Content 'GatewayApp/GatewayApp.csproj'
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          $inputVersion = '${{ inputs.version }}'.Trim()
          $version = if ($inputVersion.Length -gt 0) { $inputVersion } else { $projectVersion }

          if ($version -notmatch '^\d+\.\d+\.\d+(-[A-Za-z0-9.-]+)?$') {
            throw "Invalid version: $version"
          }

          if ($inputVersion.Length -gt 0 -and $inputVersion -ne $projectVersion) {
            throw "Input version '$inputVersion' does not match GatewayApp.csproj version '$projectVersion'."
          }

          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ASSET_NAME=FactoryIOGateway-win-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        run: dotnet build GatewayApp.sln -c Release

      - name: Unit tests
        run: dotnet test GatewayApp.sln -c Release --no-build

      - name: Smoke tests
        run: dotnet run --project GatewayApp.SmokeTests/GatewayApp.SmokeTests.csproj -c Release --no-build

      - name: Publish single-file executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publishDir = Join-Path $env:RUNNER_TEMP 'factoryio-gateway-win-x64'

          if (Test-Path $publishDir) {
            Remove-Item -LiteralPath $publishDir -Recurse -Force
          }

          dotnet publish GatewayApp/GatewayApp.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o $publishDir `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false

          $exePath = Join-Path $publishDir 'FactoryIOGateway.exe'
          if (-not (Test-Path $exePath)) {
            throw "FactoryIOGateway.exe was not created."
          }

          Get-ChildItem -LiteralPath $publishDir -Force |
            Where-Object { $_.Name -ne 'FactoryIOGateway.exe' } |
            ForEach-Object {
              if ($_.PSIsContainer) {
                Remove-Item -LiteralPath $_.FullName -Recurse -Force
              } else {
                Remove-Item -LiteralPath $_.FullName -Force
              }
            }

          $assetDir = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          $assetPath = Join-Path $assetDir $env:ASSET_NAME
          Compress-Archive -LiteralPath $exePath -DestinationPath $assetPath -Force

          "ASSET_PATH=$assetPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up release tools
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Prepare ZIP checksum and English release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.TAG }}
        run: |
          python .github/scripts/release_assets.py prepare --repository "$env:GITHUB_REPOSITORY" --release-tag "$env:RELEASE_TAG" --asset-name FactoryIOGateway-win-x64.zip --zip "$env:ASSET_PATH"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish ZIP and checksum
        id: publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.TAG }}
        run: |
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:GITHUB_SHA, '--title', "Factory I/O Gateway $env:RELEASE_TAG", '--notes-file', 'artifacts/release/release-notes.md',
            'artifacts/release/FactoryIOGateway-win-x64.zip', 'artifacts/release/FactoryIOGateway-win-x64.zip.sha256')
          if ($env:RELEASE_TAG.Contains('-')) { $releaseArgs += '--prerelease' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "release_tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT

  check-published-release:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/virustotal-release.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
